org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ここにはマシン固有の設定を書かないこと。
#
# 例えば org.gradle.java.home（Gradle を動かす JDK のパス）は OS ごとに違うため、
# ここに書くと別マシンで必ず壊れる。ユーザー単位の設定
#   ~/.gradle/gradle.properties  （Windows は %USERPROFILE%\.gradle\gradle.properties）
# に書くか、Android Studio の Settings > Build Tools > Gradle > Gradle JDK で指定する。
#
# 必要な JDK は 17〜21。Gradle 8.9 は Java 22 以降に対応していない。

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
