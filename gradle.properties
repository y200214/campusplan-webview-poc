org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ビルドに使う JDK を明示的に固定する。
#
# 理由: Android Studio 2026 に同梱されている JDK は Java 25 で、
#       本プロジェクトが使う Gradle 8.9 は Java 25 に未対応のため同期に失敗する。
#       Android Studio 本体は同梱 JDK のまま、Gradle だけ Java 21 で動かす。
#
# 別マシンでビルドする場合は、この行を自分の環境の JDK 17〜21 のパスに書き換えるか、
# Android Studio の Settings > Build Tools > Gradle > Gradle JDK で指定すること。
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
